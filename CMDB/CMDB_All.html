<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMDB Prep (Full)</title>
<style>
  :root{
    --ink:#0f1720;
    --panel:#141d29;
    --panel2:#1b2632;
    --line:#2a3644;
    --muted:#7c8ba0;
    --text:#e8edf3;
    --accent:#3fb6a8;
    --accent-dim:#2c8a80;
    --amber:#e0a84c;
    --bad:#d9695f;
    --good:#4caf7d;
    --fire:#ef6b4d;
    --fire-dim:#c14f36;
    --mono: 'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
  body{min-height:100vh;padding:24px 16px 60px;}
  .wrap{max-width:640px;margin:0 auto;}

  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .brand h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0;color:var(--accent);cursor:pointer;}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);}

  /* ---- Home screen ---- */
  .homeintro{text-align:center;margin:10px 0 26px;}
  .homeintro h2{font-size:20px;margin:0 0 8px;}
  .homeintro p{color:var(--muted);font-size:13px;margin:0;}

  .modecards{display:flex;flex-direction:column;gap:14px;}
  .modecard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;cursor:pointer;transition:.15s;text-align:left;}
  .modecard:hover{transform:translateY(-2px);}
  .modecard.crash:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(63,182,168,.12);}
  .modecard.mock:hover{border-color:var(--fire);box-shadow:0 8px 24px rgba(239,107,77,.14);}
  .modecard .emoji{font-size:26px;line-height:1;margin-bottom:10px;display:block;}
  .modecard .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px;}
  .modecard.crash .tag{color:var(--accent);}
  .modecard.mock .tag{color:var(--fire);}
  .modecard .tagline{font-size:17px;font-weight:700;margin-bottom:6px;}
  .modecard .desc{font-size:13px;color:var(--muted);line-height:1.5;margin:0;}

  /* ---- Shared: progress / cards / options ---- */
  .progressrow{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .progressrow .count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;}
  .barouter{flex:1;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
  .barinner{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));width:0%;transition:width .25s ease;}
  .barinner.fire{background:linear-gradient(90deg,var(--fire-dim),var(--fire));}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;}
  .stat .n{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1;}
  .stat .l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
  .stat.mastered .n{color:var(--good);}
  .stat.weak .n{color:var(--amber);}
  .stat.wrong .n{color:var(--bad);}

  .modes{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .modebtn{flex:1;min-width:90px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:9px 6px;border-radius:8px;cursor:pointer;font-weight:600;letter-spacing:.02em;transition:.15s;}
  .modebtn.active{background:var(--accent);color:#06211d;border-color:var(--accent);}
  .modebtn:hover:not(.active){border-color:var(--accent-dim);color:var(--text);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 18px 18px;min-height:260px;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .qnum{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;}
  .qtag{font-family:var(--mono);font-size:10px;background:var(--panel2);border:1px solid var(--line);color:var(--amber);padding:2px 8px;border-radius:20px;}
  .qtext{font-size:16.5px;line-height:1.45;margin-bottom:16px;font-weight:500;}

  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:flex-start;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;transition:.12s;}
  .opt:hover{border-color:var(--accent-dim);}
  .opt .letter{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--muted);width:18px;flex-shrink:0;padding-top:1px;}
  .opt .otext{font-size:14px;line-height:1.4;}
  .opt.selected{border-color:var(--accent);background:rgba(63,182,168,.12);}
  .opt.selected .letter{color:var(--accent);}
  .opt.correct{border-color:var(--good);background:rgba(76,175,125,.15);}
  .opt.correct .letter{color:var(--good);}
  .opt.incorrect{border-color:var(--bad);background:rgba(217,105,95,.15);}
  .opt.incorrect .letter{color:var(--bad);}
  .opt.disabled{cursor:default;}

  .feedback{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;display:none;}
  .feedback.show{display:block;}
  .feedback.right{background:rgba(76,175,125,.15);color:var(--good);border:1px solid rgba(76,175,125,.3);}
  .feedback.wrong{background:rgba(217,105,95,.15);color:var(--bad);border:1px solid rgba(217,105,95,.3);}

  .actions{display:flex;gap:8px;margin-top:16px;}
  .btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.02em;transition:.12s;}
  .btn-primary{background:var(--accent);color:#06211d;}
  .btn-primary:hover:not(:disabled){background:#4fc9ba;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-fire{background:var(--fire);color:#2a0f08;}
  .btn-fire:hover:not(:disabled){background:#f4886c;}
  .btn-ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover:not(:disabled){color:var(--text);border-color:var(--accent-dim);}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .big{font-size:34px;margin-bottom:8px;}
  .empty h2{color:var(--good);margin:0 0 6px;font-size:18px;}
  .empty p{font-size:13px;margin:0;}

  .hint{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;font-family:var(--mono);}
  .resetrow{text-align:center;margin-top:22px;}
  .resetlink{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;}
  .resetlink:hover{color:var(--bad);}

  .locked{max-width:420px;margin:18vh auto 0;text-align:center;padding:32px 24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;}
  .locked .big{font-size:34px;margin-bottom:10px;}
  .locked h2{margin:0 0 8px;font-size:17px;color:var(--bad);}
  .locked p{font-size:13px;color:var(--muted);margin:0;line-height:1.5;}

  /* ---- Matching / drag-drop questions ---- */
  .matchHint{font-size:11px;color:var(--muted);margin-bottom:12px;font-family:var(--mono);}
  .matchWrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .matchCol{display:flex;flex-direction:column;gap:8px;}
  .matchColLabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
  .matchItem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 10px;cursor:pointer;font-size:12.5px;line-height:1.35;transition:.12s;position:relative;}
  .matchItem:hover{border-color:var(--accent-dim);}
  .matchItem .midx{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--muted);margin-right:4px;}
  .matchItem.active{border-color:var(--amber);background:rgba(224,168,76,.14);box-shadow:0 0 0 1px var(--amber) inset;}
  .matchItem.paired{border-color:var(--accent-dim);}
  .matchItem .pairtag{display:block;margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--accent);}
  .matchItem.correct{border-color:var(--good);background:rgba(76,175,125,.15);}
  .matchItem.incorrect{border-color:var(--bad);background:rgba(217,105,95,.15);}
  .matchItem.disabled{cursor:default;}
  .matchClear{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 4px;}
  .matchClear:hover{color:var(--bad);}
  .matchScoreLine{text-align:center;font-size:12px;color:var(--muted);margin-top:12px;font-family:var(--mono);}

  /* ---- Mock test results ---- */
  .results{text-align:center;padding:10px 6px 4px;}
  .ringwrap{position:relative;width:220px;height:220px;margin:10px auto 8px;}
  .ring{width:220px;height:220px;border-radius:50%;-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 20px), #000 calc(100% - 20px));mask:radial-gradient(farthest-side, transparent calc(100% - 20px), #000 calc(100% - 20px));}
  .ringcenter{position:absolute;inset:20px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ringcenter .pct{font-family:var(--mono);font-size:40px;font-weight:800;line-height:1;}
  .ringcenter .pctlabel{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px;}

  .passbadge{display:inline-block;margin-top:6px;padding:6px 18px;border-radius:20px;font-weight:800;font-size:13px;letter-spacing:.04em;}
  .passbadge.pass{background:rgba(76,175,125,.18);color:var(--good);border:1px solid rgba(76,175,125,.35);}
  .passbadge.fail{background:rgba(217,105,95,.18);color:var(--bad);border:1px solid rgba(217,105,95,.35);}

  .scorerow{display:flex;justify-content:center;gap:24px;margin-top:22px;}
  .scorebox{text-align:center;}
  .scorebox .n{font-family:var(--mono);font-size:22px;font-weight:700;}
  .scorebox .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px;}
  .scorebox.good .n{color:var(--good);}
  .scorebox.bad .n{color:var(--bad);}

  .threshold{font-size:12px;color:var(--muted);margin-top:18px;font-family:var(--mono);}

  .reviewlist{text-align:left;margin-top:24px;}
  .reviewitem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .reviewitem .rq{font-size:13px;font-weight:600;margin-bottom:6px;}
  .reviewitem .ra{font-family:var(--mono);font-size:11px;}
  .reviewitem .ra.wrong{color:var(--bad);}
  .reviewitem .ra.right{color:var(--good);}

  .starttext{text-align:center;padding:20px 10px 4px;}
  .starttext h2{margin:0 0 10px;font-size:19px;}
  .starttext p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px;}

  .backlink{font-size:12px;color:var(--muted);cursor:pointer;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);margin-bottom:16px;padding:9px 16px;border-radius:8px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;transition:.12s;}
  .backlink:hover{color:var(--text);border-color:var(--accent-dim);background:var(--panel);}

  .unlockBanner{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(90deg,#1f8a6f,#25a884);color:#06211d;text-align:center;padding:10px 12px;text-decoration:none;font-weight:700;box-shadow:0 -4px 16px rgba(0,0,0,.35);animation:unlockBlink 1.4s ease-in-out infinite;}
  .unlockBanner .unlockLine1{display:block;font-size:13px;letter-spacing:.02em;}
  .unlockBanner .unlockLine2{display:block;font-size:11px;font-family:var(--mono);font-weight:600;opacity:.9;margin-top:2px;}
  @keyframes unlockBlink{
    0%,100%{opacity:1;}
    50%{opacity:.55;}
  }
  body.hasUnlockBanner{padding-bottom:76px;}

  @media (max-width:420px){
    .qtext{font-size:15px;}
    .stat .n{font-size:16px;}
    .ringwrap{width:190px;height:190px;}
    .ring{width:190px;height:190px;}
    .ringcenter{inset:16px;}
    .ringcenter .pct{font-size:34px;}
    .matchWrap{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1 id="brandTitle">CMDB Prep (Full)</h1>
    <div class="sub">CMDB &middot; 222Q</div>
  </div>
  <div id="app"></div>
</div>



<script>
window.HRSD_QUESTIONS = [{"type":"mc","question":"ServiceNow Event Management significantly benefits from a well-maintained and properly populated CMDB. What are key advantages it provides to Event Management? (Choose 2 options)","options":[{"letter":"A","text":"Mapped services provide visibility to users consuming the service"},{"letter":"B","text":"Binding of alerts to specific CIs"},{"letter":"C","text":"Correlation of alerts to knowledge base articles"},{"letter":"D","text":"Mapped services provide visibility to the business impact of an alert"}],"answer":"BD","num":1},{"type":"mc","question":"A Configuration Manager is managing a CI class in the CMDB. The identification rule(s) needs an update. Where can the Configuration Manager view and configure the existing identification rule(s) for the class? (Choose 2 options)","options":[{"letter":"A","text":"API Integrations"},{"letter":"B","text":"IRE Application"},{"letter":"C","text":"CI Class Manager"},{"letter":"D","text":"CI Identifiers module"}],"answer":"CD","num":2},{"type":"mc","question":"A hospital has received a new CT Scanner. The inventory management team has created a catalog item doctors can use to schedule patients for scans. What CSDM domain should the inventory management team map the catalog item to?","options":[{"letter":"A","text":"Design and Planning (Design)"},{"letter":"B","text":"Build and Integration (Build)"},{"letter":"C","text":"Service Delivery (Manage Technical Service)"},{"letter":"D","text":"Foundation"},{"letter":"E","text":"Service Consumption (Sell/Consume)"}],"answer":"E","num":3},{"type":"mc","question":"An Enterprise Architect of a financial services company is working across the enterprise and wants to track their capabilities. Which CSDM 5 domain is used?","options":[{"letter":"A","text":"Foundation"},{"letter":"B","text":"Build and Integration (Build)"},{"letter":"C","text":"Design and Planning (Design)"},{"letter":"D","text":"Service Consumption (Sell/Consume)"},{"letter":"E","text":"Service Delivery (Manage Technical)"}],"answer":"C","num":4},{"type":"mc","question":"The CMDB Administrator wants to leverage the Staleness metric from the CMDB Health Dashboard - Correctness Scorecard. Which field is used to calculate the duration of this metric?","options":[{"letter":"A","text":"Last modified on (last_modified)"},{"letter":"B","text":"Created (sys_created_on)"},{"letter":"C","text":"Updated (sys_updated_on)"},{"letter":"D","text":"First discovered (first_discovered)"},{"letter":"E","text":"Most recent discovery (last_discovery)"}],"answer":"E","num":5},{"type":"mc","question":"A CMDB Architect intends to populate the CMDB using the CSDM guidance. Which key stakeholders from the organization should be involved in decisions regarding population of the CMDB using the CSDM Crawl Stage?","options":[{"letter":"A","text":"Business Service Manager, Technology Service Owner"},{"letter":"B","text":"Application Owner, Application Service Owner"},{"letter":"C","text":"Customer Service Manager, Infrastructure Manager"}],"answer":"B","num":6},{"type":"mc","question":"A CMDB Administrator has taken over management of a ServiceNow instance and has determined there are multiple deficiencies in the CMDB. During review of the CMDB Data Foundations Dashboard, the Administrator sees that ServiceNow offers Remediation Playbooks. How can Playbooks assist the Administrator in resolving these issues?","options":[{"letter":"A","text":"Playbooks can automatically track common CMDB issues and output metrics."},{"letter":"B","text":"Playbooks can be installed in the instance to automatically fix issues."},{"letter":"C","text":"Playbooks can help analyze and fix issues."}],"answer":"C","num":7},{"type":"mc","question":"What is the baseline relationship descriptor pair standard between an application and a server in ServiceNow?","options":[{"letter":"A","text":"Application > Uses::Used by > Server"},{"letter":"B","text":"Application > Runs::Runs On > Server"},{"letter":"C","text":"Application > Runs on::Runs > Server"},{"letter":"D","text":"Application > Used by::Uses > Server"}],"answer":"B","num":8},{"type":"mc","question":"An organization needs to maintain non-discoverable attributes, such as warranty expiration dates, for hardware CIs. These attributes are not updated by automated discovery tools. What method ensures these attributes are accurately maintained for all CIs?","options":[{"letter":"A","text":"Create a new CI class specifically for non-discoverable attributes"},{"letter":"B","text":"Use the CMDB Reconciliation Engine to update the attributes"},{"letter":"C","text":"Use a scheduled data import to update the attributes from an external source"}],"answer":"C","num":9},{"type":"mc","question":"A Service Desk Manager wants to leverage the Unified Map to find active incidents or problems for a selected CI. Which panel will give the manager visibility and details?","options":[{"letter":"A","text":"Overview"},{"letter":"B","text":"Application services"},{"letter":"C","text":"Related items"},{"letter":"D","text":"Attributes"}],"answer":"C","num":10},{"type":"mc","question":"A Service Portfolio Manager wants to know what Application Services their Business Service Offerings depend on. What stage of CSDM maps this specific relationship context?","options":[{"letter":"A","text":"Fly"},{"letter":"B","text":"Crawl"},{"letter":"C","text":"Foundation"},{"letter":"D","text":"Run"},{"letter":"E","text":"Walk"}],"answer":"E","num":11},{"type":"mc","question":"A CMDB Administrator needs to track which CIs and CI classes are missing key mandatory data. Which CMDB Health Dashboard scorecard supports tracking this requirement?","options":[{"letter":"A","text":"Compliance"},{"letter":"B","text":"Correctness"},{"letter":"C","text":"Completeness"}],"answer":"C","num":12},{"type":"mc","question":"During a CMDB Implementation, a team member is tasked with ensuring the accuracy and completeness of CI data. This person is also responsible for maintaining data quality and resolving discrepancies. Which role is responsible for these specific tasks?","options":[{"letter":"A","text":"Service Owner"},{"letter":"B","text":"CMDB Architect"},{"letter":"C","text":"Configuration Manager"},{"letter":"D","text":"IT Asset Manager"}],"answer":"C","num":13},{"type":"mc","question":"A CMDB Administrator needs insights into how their CMDB is configured according to ServiceNow recommended baseline practice. Which framework dashboard tool should be referenced?","options":[{"letter":"A","text":"CMDB Data Foundation Dashboard"},{"letter":"B","text":"CMDB Workspace"},{"letter":"C","text":"CMDB Health Dashboard"},{"letter":"D","text":"CMDB Data Manager"}],"answer":"A","num":14},{"type":"mc","question":"A customer wants to model their business applications and would like to capture different types of data that includes Personally Identifiable Information (PII) data. Based on these requirements, which CSDM CMDB class needs to be leveraged to achieve this?","options":[{"letter":"A","text":"Business Capability"},{"letter":"B","text":"API Component"},{"letter":"C","text":"Information Object"},{"letter":"D","text":"Data Classification"}],"answer":"C","num":15},{"type":"mc","question":"A CMDB Administrator needs to create a new CI class for the Internet of Things (IoT) Sensor in ServiceNow. What are the recommended practices for this specific activity? (Choose 2 options)","options":[{"letter":"A","text":"Install or update the CMDB CI Class Models store application, and verify the class does not already exist"},{"letter":"B","text":"Modify an existing class"},{"letter":"C","text":"Add a new class under an appropriate parent class"},{"letter":"D","text":"Delete an unused class, and replace it with the new one"}],"answer":"AC","num":16},{"type":"mc","question":"A CMDB Data Manager needs to access the ServiceNow platform to create, publish, and manage policies that automate and govern CI lifecycle operations, ensuring the CMDB remains healthy and efficient. Where can the Data Manager execute this?","options":[{"letter":"A","text":"CMDB Workspace CMDB 360 tab"},{"letter":"B","text":"Service Operations Workspace"},{"letter":"C","text":"CI Class Manager"},{"letter":"D","text":"CMDB Workspace Management tab"}],"answer":"D","num":17},{"type":"mc","question":"What configuration ensures data volume in the CMDB remains consistently clean and manageable over time?","options":[{"letter":"A","text":"Scheduled Jobs"},{"letter":"B","text":"Business Rules"},{"letter":"C","text":"Archive Policies"}],"answer":"C","num":18},{"type":"mc","question":"Which of the following are recognized business values derived from a robust CMDB implementation? (Choose 2 options)","options":[{"letter":"A","text":"Collecting and managing financial data"},{"letter":"B","text":"Streamlining incident and change management"},{"letter":"C","text":"Strengthening operational resiliency"},{"letter":"D","text":"Automating maintenance for CI relationships"}],"answer":"BC","num":19},{"type":"mc","question":"Which ServiceNow automated configuration solutions natively create dynamic relationships between CIs? (Choose 2 options)","options":[{"letter":"A","text":"Discovery"},{"letter":"B","text":"Workflow Studio"},{"letter":"C","text":"Service Mapping"},{"letter":"D","text":"IntegrationHub ETL"}],"answer":"AC","num":20},{"type":"mc","question":"When integrating data into the CMDB using import sets and transform maps, which type of map script is added to ensure that incoming data is explicitly processed through the Identification and Reconciliation Engine (IRE)?","options":[{"letter":"A","text":"onComplete"},{"letter":"B","text":"onBefore"},{"letter":"C","text":"onStart"},{"letter":"D","text":"onAfter"}],"answer":"D","num":21},{"type":"mc","question":"A service owner is using Unified Map to understand the composition of a service but wants to filter out irrelevant information. Which options are available to the service owner from the map filter panel?","options":[{"letter":"A","text":"Discovery source"},{"letter":"B","text":"Managed by group"},{"letter":"C","text":"Business criticality"},{"letter":"D","text":"CI type"}],"answer":"AD","num":22},{"type":"mc","question":"A Configuration Management Governance team is transitioning from utilizing legacy CMDB status fields to CSDM life cycle status fields. Which mapping table can be modified?","options":[{"letter":"A","text":"Life Cycle Mapping [life_cycle_mapping]"},{"letter":"B","text":"Life Cycle Stages [life_cycle_stage]"},{"letter":"C","text":"Life Cycle Controls [life_cycle_control]"},{"letter":"D","text":"Life Cycle Stage Status [life_cycle_stage_status]"}],"answer":"A","num":23},{"type":"mc","question":"In an enterprise architecture alignment strategy, different stakeholders listed multiple use cases that they expect to mature over time. Which use case directly requires the implementation of Information Objects?","options":[{"letter":"A","text":"The Asset Management team wants to understand the asset life cycle compliancy in a Business Application context."},{"letter":"B","text":"The SecOps team wants to understand the operational risk in the Business Application context."},{"letter":"C","text":"The Business Service Management team wants to understand the operational impact for their consumer parties."},{"letter":"D","text":"The Event Operations team wants to automate their events into incident for operational actions."},{"letter":"E","text":"The Customer Service team wants to onboard pro-active case management."}],"answer":"B","num":24},{"type":"mc","question":"A customer wants recently imported server records to be automatically reclassified into more specific CMDB classes after being discovered using ServiceNow Discovery. During the discovery process, if existing Server \\[cmdb_ci_server\\] records are reclassified into the Linux \\[cmdb_ci_linux_server\\] and Windows Server \\[cmdb_ci_win_server\\] classes, which reclassification operation occurred?"," form Data Owner wants to improve data quality with a few reconciliation rules across the live discovery sources that are being used. The Data Owner knows the best option is to include CMDB 360/Multisource CMDB to manage and monitor discovery sources, but the company currently does not have a license for ITOM Discovery that is required for CMDB 360/Multisource CMDB. What can the Data Owner do in this case?","options":[{"letter":"A","text":"CMDB 360/Multisource is a platform product that can be used immediately."},{"letter":"B","text":"ITOM Discovery needs to be purchased to take advantage of the multisource IRE Rules."},{"letter":"C","text":"The IRE reconciliation rules can use discovery sources regardless of CMDB 360 being enabled."}],"answer":"C","num":55},{"type":"mc","question":"A Data Center Manager is working with the CMDB CI Class Manager to define the relationship between Application Servers and the Applications they host. The company has multiple Application Servers that host one or more Applications. Which describes the relationship between the Application Server table (\\[cmdb_ci_app_server\\]) and the Application table (\\[cmdb_ci_appl\\])?","options":[{"letter":"A","text":"Many-to-one"},{"letter":"B","text":"Many-to-many"},{"letter":"C","text":"One-to-many"},{"letter":"D","text":"One-to-one"}],"answer":"B","num":56},{"type":"mc","question":"A CMDB Administrator wants to improve data quality related specifically to the CSDM alignment metrics. Which action should the Administrator take to meet this goal?","options":[{"letter":"A","text":"Use the CSDM Data Foundations Dashboard"},{"letter":"B","text":"Use the default configured CMDB Health Dashboard"},{"letter":"C","text":"Start the ServiceNow Health Scan"}],"answer":"A","num":57},{"type":"mc","question":"What is the key functional difference between Data Certification and Attestation policies when managing a CI lifecycle?","options":[{"letter":"A","text":"Attestation can be scheduled, while Data Certificat <script>
// Scales to any number of people: this file is hosted once (e.g. on GitHub
// Pages), and each person gets a link like
//   https://you.github.io/hrsd-drill/quiz50.html?id=alice
// access_all.json (hosted next to this file, in the same repo) is a flat map
// of id -> true/false, e.g. {"alice": true, "bob": true, "carol": false}.
// To onboard someone: add "theirid": true to access_all.json and send them
// the link with their id. To revoke: flip their entry to false. No new
// file or re-send needed for either action.
//
// This is a client-side gate, not real security \u2014 someone who saves the
// file before revocation keeps a working offline copy, and a technical
// user could edit the HTML to remove the check. It stops casual continued
// access once you've turned someone off, for anyone who's online.
function showLocked(message){
  const wrap = document.querySelector('.wrap');
  if(wrap){
    wrap.innerHTML = `
      <div class="locked">
        <div class="big">&#128274;</div>
        <h2>Access unavailable</h2>
        <p>${message}<br>Ask the sender for a new link if you still need it.</p>
      </div>`;
  }
}

window.__ACCESS_CHECK__ = (async function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if(!id){
    return false; // no id in link \u2014 fail open (e.g. testing a raw download)
  }

  try{
    const res = await fetch(`access_cmdb_all.json?t=${Date.now()}`, {cache: 'no-store'});
    if(!res.ok) return false;
    const list = await res.json();
    if(list[id] === false){
      showLocked('Your access to this tool has been revoked.');
      return true;
    }
    if(!(id in list)){
      showLocked('This link is not recognized. Ask the sender for a valid link.');
      return true;
    }
  }catch(e){
    // offline or access_all.json unreachable \u2014 fail open
  }
  return false;
})();
</script>
<script>
(function(){
  const ALL = window.HRSD_QUESTIONS;
  const PASS_THRESHOLD = 70;
  const RAINBOW = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6'];
  const appEl = document.getElementById('app');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function isMulti(q){ return q.type === 'mc' && q.answer.length > 1; }
  function letterFor(idx){ return String.fromCharCode(65 + idx); }

  function shuffleArray(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function shuffledRightFor(q){
    const withOrig = q.pairs.map((p,i)=>({text:p.right, orig:i}));
    return shuffleArray(withOrig);
  }

  // Renders a two-column tap-to-pair matching UI into the element with id
  // `containerId`. onLeftTap/onRightTap are click handlers (leftIdx)/(rightIdx);
  // pass null for either once the question is answered to freeze interaction.
  // showResult=true renders correct/incorrect coloring instead of tap state.
  function renderMatchArea(containerId, q, shuffled, assignment, activeLeft, onLeftTap, onRightTap, onReady, showResult){
    const el = document.getElementById(containerId);
    if(!el) return;

    const leftHtml = q.pairs.map((p, i)=>{
      const assignedIdx = assignment[i];
      let cls = 'matchItem';
      if(!showResult){
        if(activeLeft === i) cls += ' active';
        else if(assignedIdx !== null) cls += ' paired';
      } else {
        cls += ' disabled';
        if(assignedIdx !== null && shuffled[assignedIdx].orig === i) cls += ' correct';
        else cls += ' incorrect';
      }
      const tag = assignedIdx !== null ? `<span class="pairtag">\u2194 ${letterFor(assignedIdx)}</span>` : '';
      return `<div class="${cls}" data-leftidx="${i}"><span class="midx">${i+1}.</span>${escapeHtml(p.left)}${tag}</div>`;
    }).join('');

    const rightHtml = shuffled.map((r, j)=>{
      const usedByLeft = assignment.findIndex(a => a === j);
      let cls = 'matchItem';
      if(!showResult){
        if(usedByLeft !== -1) cls += ' paired';
      } else {
        cls += ' disabled';
        if(usedByLeft !== -1){
          cls += (shuffled[j].orig === usedByLeft) ? ' correct' : ' incorrect';
        }
      }
      const tag = usedByLeft !== -1 ? `<span class="pairtag">\u2194 ${usedByLeft+1}</span>` : '';
      return `<div class="${cls}" data-rightidx="${j}"><span class="midx">${letterFor(j)}.</span>${escapeHtml(r.text)}${tag}</div>`;
    }).join('');

    el.innerHTML = `
      <div class="matchWrap">
        <div class="matchCol">
          <div class="matchColLabel">Items</div>
          ${leftHtml}
        </div>
        <div class="matchCol">
          <div class="matchColLabel">Descriptions</div>
          ${rightHtml}
        </div>
      </div>
    `;

    if(onLeftTap){
      el.querySelectorAll('[data-leftidx]').forEach(node=>{
        node.addEventListener('click', ()=> onLeftTap(parseInt(node.getAttribute('data-leftidx'), 10)));
      });
    }
    if(onRightTap){
      el.querySelectorAll('[data-rightidx]').forEach(node=>{
        node.addEventListener('click', ()=> onRightTap(parseInt(node.getAttribute('data-rightidx'), 10)));
      });
    }
    if(onReady) onReady();
  }

  function shuffledIndices(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  // ================= HOME =================
  function setUnlockBannerVisible(show){
    const b = document.getElementById('unlockBanner');
    if(!b) return;
    b.style.display = show ? 'block' : 'none';
    document.body.classList.toggle('hasUnlockBanner', show);
  }

  function renderHome(){
    setUnlockBannerVisible(false);
    appEl.innerHTML = `
      <div class="homeintro">
        <h2>Pick your mode</h2>
        <p>Same 50 questions, two different ways to use them.</p>
      </div>
      <div class="modecards">
        <div class="modecard crash" id="goCrash">
          <span class="emoji">\u26a1</span>
          <div class="tag">Crash Course</div>
          <div class="tagline">No Time? No Problem.</div>
          <p class="desc">Master key questions fast. Learn smart, remember more, and get test-ready \u2014 even with a busy schedule.</p>
        </div>
        <div class="modecard mock" id="goMock">
          <span class="emoji">\ud83d\udd25</span>
          <div class="tag">Mock Test</div>
          <div class="tagline">Fire Up. Test. Conquer.</div>
          <p class="desc">Test your recall, build confidence, and find out if you're ready.</p>
        </div>
      </div>
    `;
    document.getElementById('goCrash').addEventListener('click', initCrashCourse);
    document.getElementById('goMock').addEventListener('click', initMockTest);
  }

  function backButton(){
    return `<button class="backlink" id="homeBtn">&larr; back to modes</button>`;
  }
  function wireBackButton(){
    const b = document.getElementById('homeBtn');
    if(b) b.addEventListener('click', renderHome);
  }

  // ================= CRASH COURSE (drill mode) =================
  const STORE_KEY = 'cmdb_progress_v1_all';
  let stats = {};
  let ccMode = 'all';
  let ccPool = [];
  let ccCurrent = null;
  let ccSelected = new Set();
  let ccAnswered = false;
  let ccSessionStreak = 0;

  async function loadStats(){
    try{
      if(window.storage){
        const r = await window.storage.get(STORE_KEY, false);
        if(r && r.value){ stats = JSON.parse(r.value); return; }
      }
      const local = localStorage.getItem(STORE_KEY);
      if(local){ stats = JSON.parse(local); }
    }catch(e){ stats = {}; }
  }
  async function saveStats(){
    try{
      if(window.storage){ await window.storage.set(STORE_KEY, JSON.stringify(stats), false); return; }
      localStorage.setItem(STORE_KEY, JSON.stringify(stats));
    }catch(e){}
  }
  function getStat(num){
    if(!stats[num]) stats[num] = {seen:0, streak:0, ever:false};
    return stats[num];
  }
  function classify(num){
    const s = getStat(num);
    if(s.seen === 0) return 'unseen';
    if(s.streak >= 2) return 'mastered';
    return 'weak';
  }
  function computeCounts(){
    let mastered=0, weak=0, unseen=0;
    ALL.forEach(q=>{
      const c = classify(q.num);
      if(c==='mastered') mastered++;
      else if(c==='weak') weak++;
      else unseen++;
    });
    return {mastered, weak, unseen};
  }

  async function initCrashCourse(){
    await loadStats();
    renderCrashShell();
    ccMode = 'all';
    buildCcPool();
    ccNextQuestion();
  }

  function renderCrashShell(){
    appEl.innerHTML = `
      ${backButton()}
      <div class="stats">
        <div class="stat mastered"><div class="n" id="statMastered">0</div><div class="l">Mastered</div></div>
        <div class="stat weak"><div class="n" id="statWeak">0</div><div class="l">Weak</div></div>
        <div class="stat" ><div class="n" id="statUnseen">0</div><div class="l">Unseen</div></div>
        <div class="stat wrong"><div class="n" id="statStreak">0</div><div class="l">Streak</div></div>
      </div>
      <div class="barouter" style="margin-bottom:18px;"><div class="barinner" id="progressBarCC"></div></div>
      <div class="modes">
        <button class="modebtn active" data-mode="all">All 222</button>
        <button class="modebtn" data-mode="weak">Weak only</button>
        <button class="modebtn" data-mode="unseen">Unseen only</button>
      </div>
      <div class="card" id="ccCard"></div>
      <div class="hint">tap an option, then Check &middot; multi-select questions need all correct letters</div>
      <button class="btn btn-ghost" id="ccResetBtn" style="width:100%;margin-top:22px;">Reset all Crash Course progress</button>
    `;
    wireBackButton();
    document.querySelectorAll('.modebtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.modebtn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        ccMode = btn.getAttribute('data-mode');
        buildCcPool();
        ccNextQuestion();
      });
    });
    // Two-tap confirm instead of window.confirm() — native confirm() dialogs
    // are silently blocked or no-op in many in-app browsers (Slack, WhatsApp,
    // Gmail preview, etc.), which made this button appear broken there.
    let resetArmed = false;
    let resetTimer = null;
    const resetBtn = document.getElementById('ccResetBtn');
    resetBtn.addEventListener('click', async ()=>{
      if(!resetArmed){
        resetArmed = true;
        resetBtn.textContent = 'Tap again to confirm reset';
        resetBtn.style.color = 'var(--bad)';
        resetBtn.style.borderColor = 'var(--bad)';
        clearTimeout(resetTimer);
        resetTimer = setTimeout(()=>{
          resetArmed = false;
          resetBtn.textContent = 'Reset all Crash Course progress';
          resetBtn.style.color = '';
          resetBtn.style.borderColor = '';
        }, 4000);
        return;
      }
      clearTimeout(resetTimer);
      resetArmed = false;
      stats = {};
      await saveStats();
      ccSessionStreak = 0;
      buildCcPool();
      ccRefreshStats();
      ccNextQuestion();
      resetBtn.textContent = 'Progress reset \u2713';
      resetBtn.style.color = 'var(--good)';
      resetBtn.style.borderColor = 'var(--good)';
      setTimeout(()=>{
        resetBtn.textContent = 'Reset all Crash Course progress';
        resetBtn.style.color = '';
        resetBtn.style.borderColor = '';
      }, 1800);
    });
    ccRefreshStats();
  }

  function ccRefreshStats(){
    const c = computeCounts();
    const sm = document.getElementById('statMastered');
    if(!sm) return;
    document.getElementById('statMastered').textContent = c.mastered;
    document.getElementById('statWeak').textContent = c.weak;
    document.getElementById('statUnseen').textContent = c.unseen;
    document.getElementById('statStreak').textContent = ccSessionStreak;
    document.getElementById('progressBarCC').style.width = Math.round((c.mastered/ALL.length)*100) + '%';
  }

  function buildCcPool(){
    if(ccMode==='all') ccPool = ALL.slice();
    else ccPool = ALL.filter(q => classify(q.num) === ccMode);
    for(let i=ccPool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [ccPool[i],ccPool[j]]=[ccPool[j],ccPool[i]];
    }
  }

  function ccNextQuestion(){
    if(ccPool.length === 0) buildCcPool();
    if(ccPool.length === 0){ ccRenderEmpty(); return; }
    ccCurrent = ccPool.pop();
    ccSelected = new Set();
    ccAnswered = false;
    ccRender();
  }

  function ccRenderEmpty(){
    const cardEl = document.getElementById('ccCard');
    const label = ccMode==='weak' ? 'weak questions' : ccMode==='unseen' ? 'unseen questions' : 'questions';
    cardEl.innerHTML = `<div class="empty"><div class="big">&#10003;</div><h2>Nothing left in this set</h2><p>No ${label} remaining right now \u2014 switch mode or reset progress.</p></div>`;
  }

  function ccRender(){
    const q = ccCurrent;
    if(q.type === 'match'){ ccRenderMatch(); return; }
    ccRenderMC();
  }

  function ccRenderMC(){
    const cardEl = document.getElementById('ccCard');
    const q = ccCurrent;
    const multi = isMulti(q);
    let optsHtml = q.options.map(o => {
      return `<div class="opt" data-letter="${o.letter}"><span class="letter">${o.letter}</span><span class="otext">${escapeHtml(o.text)}</span></div>`;
    }).join('');

    cardEl.innerHTML = `
      <div class="qmeta">
        <span class="qnum">Q${q.num} / 222</span>
        ${multi ? `<span class="qtag">choose ${q.answer.length}</span>` : ''}
      </div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      <div class="options">${optsHtml}</div>
      <div class="feedback" id="ccFeedback"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="ccSkipBtn">Skip</button>
        <button class="btn btn-primary" id="ccCheckBtn" disabled>Check</button>
      </div>
    `;

    document.querySelectorAll('#ccCard .opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(ccAnswered) return;
        const letter = el.getAttribute('data-letter');
        if(!multi){
          ccSelected = new Set([letter]);
          document.querySelectorAll('#ccCard .opt').forEach(o=>o.classList.remove('selected'));
          el.classList.add('selected');
        } else {
          if(ccSelected.has(letter)){ ccSelected.delete(letter); el.classList.remove('selected'); }
          else { ccSelected.add(letter); el.classList.add('selected'); }
        }
        document.getElementById('ccCheckBtn').disabled = ccSelected.size === 0;
      });
    });

    document.getElementById('ccCheckBtn').addEventListener('click', ccCheckAnswer);
    document.getElementById('ccSkipBtn').addEventListener('click', ()=>{ ccNextQuestion(); });
  }

  // ---- Matching (drag-drop / tap-to-pair) state for Crash Course ----
  let ccMatchShuffled = [];
  let ccMatchAssignment = [];
  let ccMatchActive = null;

  function ccRenderMatch(){
    const cardEl = document.getElementById('ccCard');
    const q = ccCurrent;
    ccMatchShuffled = shuffledRightFor(q);
    ccMatchAssignment = new Array(q.pairs.length).fill(null);
    ccMatchActive = null;

    cardEl.innerHTML = `
      <div class="qmeta">
        <span class="qnum">Q${q.num} / 222</span>
        <span class="qtag">match all</span>
      </div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      <div class="matchHint">Tap an item on the left, then tap its match on the right.</div>
      <div id="ccMatchArea"></div>
      <div class="feedback" id="ccFeedback"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="ccSkipBtn">Skip</button>
        <button class="btn btn-primary" id="ccCheckBtn" disabled>Check</button>
      </div>
    `;
    renderMatchArea('ccMatchArea', q, ccMatchShuffled, ccMatchAssignment, ccMatchActive,
      onCcLeftTap, onCcRightTap, updateCcCheckState);

    document.getElementById('ccCheckBtn').addEventListener('click', ccCheckMatchAnswer);
    document.getElementById('ccSkipBtn').addEventListener('click', ()=>{ ccNextQuestion(); });
    updateCcCheckState();
  }

  function ccRerenderMatchArea(){
    const q = ccCurrent;
    renderMatchArea('ccMatchArea', q, ccMatchShuffled, ccMatchAssignment, ccMatchActive,
      onCcLeftTap, onCcRightTap, updateCcCheckState);
  }
  function onCcLeftTap(leftIdx){
    if(ccAnswered) return;
    ccMatchActive = (ccMatchActive === leftIdx) ? null : leftIdx;
    ccRerenderMatchArea();
  }
  function onCcRightTap(rightIdx){
    if(ccAnswered) return;
    if(ccMatchActive === null) return;
    for(let k=0;k<ccMatchAssignment.length;k++){ if(ccMatchAssignment[k] === rightIdx) ccMatchAssignment[k] = null; }
    ccMatchAssignment[ccMatchActive] = rightIdx;
    ccMatchActive = null;
    ccRerenderMatchArea();
    updateCcCheckState();
  }
  function updateCcCheckState(){
    const btn = document.getElementById('ccCheckBtn');
    if(!btn) return;
    btn.disabled = ccMatchAssignment.some(a => a === null);
  }

  function ccCheckMatchAnswer(){
    if(ccAnswered) return;
    ccAnswered = true;
    const q = ccCurrent;
    let correctCount = 0;
    for(let i=0;i<q.pairs.length;i++){
      if(ccMatchAssignment[i] !== null && ccMatchShuffled[ccMatchAssignment[i]].orig === i) correctCount++;
    }
    const isRight = correctCount === q.pairs.length;

    renderMatchArea('ccMatchArea', q, ccMatchShuffled, ccMatchAssignment, null, null, null, null, true);

    const fb = document.getElementById('ccFeedback');
    fb.classList.add('show');
    if(isRight){
      fb.classList.add('right');
      fb.textContent = `Correct \u2014 all ${q.pairs.length} matched`;
      ccSessionStreak++;
    } else {
      fb.classList.add('wrong');
      fb.textContent = `${correctCount} of ${q.pairs.length} correct \u2014 see highlighted pairs above`;
      ccSessionStreak = 0;
    }

    const s = getStat(q.num);
    s.seen++;
    s.streak = isRight ? s.streak + 1 : 0;
    s.ever = s.ever || isRight;
    saveStats();
    ccRefreshStats();

    const checkBtn = document.getElementById('ccCheckBtn');
    checkBtn.textContent = 'Next';
    checkBtn.disabled = false;
    checkBtn.replaceWith(checkBtn.cloneNode(true));
    document.getElementById('ccCheckBtn').addEventListener('click', ()=>{ ccNextQuestion(); });
    document.getElementById('ccSkipBtn').style.visibility = 'hidden';
  }

  function ccCheckAnswer(){
    if(ccAnswered) return;
    ccAnswered = true;
    const q = ccCurrent;
    const correctSet = new Set(q.answer.split(''));
    const isRight = correctSet.size === ccSelected.size && [...correctSet].every(l=>ccSelected.has(l));

    document.querySelectorAll('#ccCard .opt').forEach(el=>{
      const letter = el.getAttribute('data-letter');
      el.classList.add('disabled');
      if(correctSet.has(letter)) el.classList.add('correct');
      else if(ccSelected.has(letter)) el.classList.add('incorrect');
    });

    const fb = document.getElementById('ccFeedback');
    fb.classList.add('show');
    if(isRight){
      fb.classList.add('right');
      fb.textContent = 'Correct \u2014 answer: ' + q.answer;
      ccSessionStreak++;
    } else {
      fb.classList.add('wrong');
      fb.textContent = 'Not quite \u2014 correct answer: ' + q.answer;
      ccSessionStreak = 0;
    }

    const s = getStat(q.num);
    s.seen++;
    s.streak = isRight ? s.streak + 1 : 0;
    s.ever = s.ever || isRight;
    saveStats();
    ccRefreshStats();

    const checkBtn = document.getElementById('ccCheckBtn');
    checkBtn.textContent = 'Next';
    checkBtn.disabled = false;
    checkBtn.replaceWith(checkBtn.cloneNode(true));
    document.getElementById('ccCheckBtn').addEventListener('click', ()=>{ ccNextQuestion(); });
    document.getElementById('ccSkipBtn').style.visibility = 'hidden';
  }

  // ================= MOCK TEST =================
  let mtOrder = [];
  let mtIdx = 0;
  let mtAnswers = {};

  function initMockTest(){
    renderMtStart();
  }

  function renderMtStart(){
    appEl.innerHTML = `
      ${backButton()}
      <div class="card">
        <div class="starttext">
          <h2>Ready when you are</h2>
          <p>222 questions, one pass through, no peeking at answers until the end \u2014 just like the real exam. You need <b>70%</b> to pass. Your progress isn't saved between sessions, so plan for one sitting (roughly 15\u201325 minutes).</p>
          <button class="btn btn-fire" id="mtStartBtn" style="width:100%;">Start mock test</button>
        </div>
      </div>
    `;
    wireBackButton();
    document.getElementById('mtStartBtn').addEventListener('click', mtStartTest);
  }

  function mtStartTest(){
    mtOrder = shuffledIndices(ALL.length);
    mtIdx = 0;
    mtAnswers = {};
    mtRenderQuestion();
  }

  function mtRenderQuestion(){
    const q = ALL[mtOrder[mtIdx]];
    if(q.type === 'match'){ mtRenderMatch(q); return; }
    mtRenderMC(q);
  }

  function mtRenderMC(q){
    const multi = isMulti(q);
    const selected = mtAnswers[q.num] || new Set();

    const optsHtml = q.options.map(o => {
      const isSel = selected.has(o.letter);
      return `<div class="opt${isSel ? ' selected' : ''}" data-letter="${o.letter}"><span class="letter">${o.letter}</span><span class="otext">${escapeHtml(o.text)}</span></div>`;
    }).join('');

    appEl.innerHTML = `
      ${backButton()}
      <div class="progressrow">
        <span class="count">${mtIdx+1} / ${ALL.length}</span>
        <div class="barouter"><div class="barinner fire" style="width:${Math.round((mtIdx/ALL.length)*100)}%;"></div></div>
      </div>
      <div class="card">
        <div class="qmeta">
          <span class="qnum">Question ${mtIdx+1}</span>
          ${multi ? `<span class="qtag">choose ${q.answer.length}</span>` : ''}
        </div>
        <div class="qtext">${escapeHtml(q.question)}</div>
        <div class="options">${optsHtml}</div>
        <div class="actions">
          <button class="btn btn-ghost" id="mtBackBtn" ${mtIdx===0 ? 'disabled' : ''}>Back</button>
          <button class="btn btn-fire" id="mtNextBtn">${mtIdx === ALL.length-1 ? 'Submit test' : 'Next'}</button>
        </div>
      </div>
      <div class="hint">Select an answer, then Next. You can change your answer before moving on.</div>
    `;
    wireBackButton();

    document.querySelectorAll('.card .opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        const letter = el.getAttribute('data-letter');
        const set = mtAnswers[q.num] || new Set();
        if(!multi){
          mtAnswers[q.num] = new Set([letter]);
          document.querySelectorAll('.card .opt').forEach(o=>o.classList.remove('selected'));
          el.classList.add('selected');
        } else {
          if(set.has(letter)){ set.delete(letter); el.classList.remove('selected'); }
          else { set.add(letter); el.classList.add('selected'); }
          mtAnswers[q.num] = set;
        }
      });
    });

    document.getElementById('mtBackBtn').addEventListener('click', ()=>{
      if(mtIdx > 0){ mtIdx--; mtRenderQuestion(); }
    });
    document.getElementById('mtNextBtn').addEventListener('click', ()=>{
      if(mtIdx < ALL.length - 1){ mtIdx++; mtRenderQuestion(); }
      else { mtFinishTest(); }
    });
  }

  function mtRenderMatch(q){
    if(!mtAnswers[q.num]){
      mtAnswers[q.num] = { shuffled: shuffledRightFor(q), assignment: new Array(q.pairs.length).fill(null) };
    }
    const state = mtAnswers[q.num];
    let active = null;

    appEl.innerHTML = `
      ${backButton()}
      <div class="progressrow">
        <span class="count">${mtIdx+1} / ${ALL.length}</span>
        <div class="barouter"><div class="barinner fire" style="width:${Math.round((mtIdx/ALL.length)*100)}%;"></div></div>
      </div>
      <div class="card">
        <div class="qmeta">
          <span class="qnum">Question ${mtIdx+1}</span>
          <span class="qtag">match all</span>
        </div>
        <div class="qtext">${escapeHtml(q.question)}</div>
        <div class="matchHint">Tap an item on the left, then tap its match on the right.</div>
        <div id="mtMatchArea"></div>
        <div class="actions">
          <button class="btn btn-ghost" id="mtBackBtn" ${mtIdx===0 ? 'disabled' : ''}>Back</button>
          <button class="btn btn-fire" id="mtNextBtn">${mtIdx === ALL.length-1 ? 'Submit test' : 'Next'}</button>
        </div>
      </div>
      <div class="hint">Tap left, then right, to pair items. You can change pairs before moving on.</div>
    `;
    wireBackButton();

    function redraw(){
      renderMatchArea('mtMatchArea', q, state.shuffled, state.assignment, active,
        (leftIdx)=>{ active = (active === leftIdx) ? null : leftIdx; redraw(); },
        (rightIdx)=>{
          if(active === null) return;
          for(let k=0;k<state.assignment.length;k++){ if(state.assignment[k] === rightIdx) state.assignment[k] = null; }
          state.assignment[active] = rightIdx;
          active = null;
          redraw();
        }
      );
    }
    redraw();

    document.getElementById('mtBackBtn').addEventListener('click', ()=>{
      if(mtIdx > 0){ mtIdx--; mtRenderQuestion(); }
    });
    document.getElementById('mtNextBtn').addEventListener('click', ()=>{
      if(mtIdx < ALL.length - 1){ mtIdx++; mtRenderQuestion(); }
      else { mtFinishTest(); }
    });
  }

  function mtBuildRainbowGradient(pct){
    if(pct <= 0) return 'var(--panel2)';
    const stops = RAINBOW.length;
    let parts = [];
    for(let i=0;i<stops;i++){
      const pos = (pct * (i+1) / stops).toFixed(2);
      parts.push(`${RAINBOW[i]} ${pos}%`);
    }
    parts.push(`var(--panel2) ${pct}%`);
    parts.push(`var(--panel2) 100%`);
    return `conic-gradient(from -90deg, ${parts.join(', ')})`;
  }

  function mtFinishTest(){
    let correctCount = 0;
    const wrongList = [];
    ALL.forEach(q=>{
      if(q.type === 'match'){
        const state = mtAnswers[q.num];
        const assignment = state ? state.assignment : new Array(q.pairs.length).fill(null);
        const shuffled = state ? state.shuffled : shuffledRightFor(q);
        const isRight = assignment.every((a,i) => a !== null && shuffled[a].orig === i);
        if(isRight) correctCount++;
        else wrongList.push({q, matchState: {assignment, shuffled}});
      } else {
        const correctSet = new Set(q.answer.split(''));
        const sel = mtAnswers[q.num] || new Set();
        const isRight = correctSet.size === sel.size && [...correctSet].every(l=>sel.has(l));
        if(isRight) correctCount++;
        else wrongList.push({q, sel});
      }
    });

    const pct = Math.round((correctCount / ALL.length) * 100);
    const passed = pct >= PASS_THRESHOLD;
    const gradient = mtBuildRainbowGradient(pct);

    appEl.innerHTML = `
      ${backButton()}
      <div class="card">
        <div class="results">
          <div class="ringwrap">
            <div class="ring" style="background:${gradient};"></div>
            <div class="ringcenter">
              <div class="pct">${pct}%</div>
              <div class="pctlabel">Score</div>
            </div>
          </div>
          <div class="passbadge ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'NOT YET'}</div>
          <div class="threshold">70% required to pass</div>
          <div class="scorerow">
            <div class="scorebox good"><div class="n">${correctCount}</div><div class="l">Correct</div></div>
            <div class="scorebox bad"><div class="n">${ALL.length - correctCount}</div><div class="l">Missed</div></div>
            <div class="scorebox"><div class="n">${ALL.length}</div><div class="l">Total</div></div>
          </div>
          <div class="actions" style="margin-top:26px;">
            <button class="btn btn-ghost" id="mtReviewBtn">${wrongList.length ? 'Review missed questions' : 'Nothing missed'}</button>
            <button class="btn btn-fire" id="mtRetakeBtn">Retake test</button>
          </div>
          <div class="reviewlist" id="mtReviewList" style="display:none;"></div>
        </div>
      </div>
    `;
    wireBackButton();

    document.getElementById('mtRetakeBtn').addEventListener('click', mtStartTest);

    const reviewBtn = document.getElementById('mtReviewBtn');
    if(wrongList.length){
      reviewBtn.addEventListener('click', ()=>{
        const rl = document.getElementById('mtReviewList');
        if(rl.style.display === 'none'){
          rl.style.display = 'block';
          rl.innerHTML = wrongList.map((item)=>{
            const q = item.q;
            if(q.type === 'match'){
              const pairsHtml = q.pairs.map((p,i)=>{
                const a = item.matchState.assignment[i];
                const yourText = a !== null ? item.matchState.shuffled[a].text : '(unpaired)';
                return `<div style="margin-top:6px;"><b>${escapeHtml(p.left)}</b><br>Your match: <span class="ra wrong" style="display:inline;">${escapeHtml(yourText)}</span><br>Correct: <span class="ra right" style="display:inline;">${escapeHtml(p.right)}</span></div>`;
              }).join('');
              return `<div class="reviewitem"><div class="rq">${escapeHtml(q.question)}</div>${pairsHtml}</div>`;
            }
            const selText = item.sel.size ? [...item.sel].sort().join('') : '(no answer)';
            return `<div class="reviewitem">
              <div class="rq">${escapeHtml(q.question)}</div>
              <div class="ra wrong">Your answer: ${selText}</div>
              <div class="ra right">Correct answer: ${q.answer}</div>
            </div>`;
          }).join('');
          reviewBtn.textContent = 'Hide review';
        } else {
          rl.style.display = 'none';
          reviewBtn.textContent = 'Review missed questions';
        }
      });
    } else {
      reviewBtn.disabled = true;
    }
  }

  document.getElementById('brandTitle').addEventListener('click', renderHome);

  (async function init(){
    const locked = await window.__ACCESS_CHECK__;
    if(locked) return;
    renderHome();
  })();
})();
</script>
</body>
